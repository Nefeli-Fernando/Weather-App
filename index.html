<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
        <source src="video/WEATHER-VID.mp4" type="video/mp4">
    </video>

    <!-- Weather search button goes here--> 
<div class="container">
<div class="search-container">
  <input class="input" type="text" placeholder="Enter City">
  <button id="searchBtn">
  <svg viewBox="0 0 24 24" class="search__icon">
    <g>
      <path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z">
      </path>
    </g>
  </svg></button>
</div>
</div>

    <main class="weather-content">
        <h1 class="page-title">Weather Now</h1>
 
        <p class="error-message"></p>
 
        <article class="card" aria-label="Today's weather">
            <h2 class="card-title">Today</h2>
 
            <div class="weather-overview">
                <img class="weather-icon" src="" alt="">
                <p class="temperature">--°</p>
            </div>
 
            <div class="weather-details">
                <p class="condition">Search a city to begin</p>
                <p class="humidity"><span>Humidity</span><strong>--%</strong></p>
            </div>
        </article>
    </main>


    <div class = "forecast">
        
    </div>
    <script src="app.js"></script>
</body>
</html>
